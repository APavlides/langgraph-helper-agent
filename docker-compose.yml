# Docker Compose for LangGraph Helper Agent
# 
# Usage:
#   docker compose run --rm agent-offline     # Run in offline mode (Interactive)
#   docker compose run --rm agent-online      # Run in online mode (Interactive)
#   docker compose run --rm setup             # Initial setup (download docs, build vectorstore)

services:
  # === Setup service (run once) ===
  setup:
    build:
      context: .
      target: runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    entrypoint: /bin/bash
    command: |
      -c "
      echo '📥 Downloading documentation...'
      python scripts/refresh_data.py --full
      echo ''
      echo '🔧 Building vector store...'
      python scripts/build_vectorstore.py
      echo ''
      echo '✅ Setup complete!'
      "
    profiles:
      - setup

  # === Offline mode agent ===
  agent-offline:
    build:
      context: .
      target: runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data:ro
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-langgraph-helper-agent}
      - AGENT_MODE=offline
    stdin_open: true
    tty: true
    command: ["--interactive"]

  # === Online mode agent ===
  agent-online:
    build:
      context: .
      target: runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data:ro
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - AGENT_MODE=online
    stdin_open: true
    tty: true
    command: ["--interactive"]

  # === Evaluation runner ===
  evaluate:
    build:
      context: .
      target: runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data:ro
      - ./evaluation:/app/evaluation
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    entrypoint: ["python", "-m", "evaluation.evaluate"]
    profiles:
      - eval

  # === Development shell ===
  dev:
    build:
      context: .
      target: runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    entrypoint: /bin/bash
    stdin_open: true
    tty: true
    profiles:
      - dev
